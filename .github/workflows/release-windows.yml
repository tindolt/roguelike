name: Build Windows Release

# Runs when you push a version tag like: git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GitHub's windows-latest runner includes MinGW (g++) in PATH via this action
      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL3
            mingw-w64-x86_64-libtcod
            mingw-w64-x86_64-zlib

      # Build the exe inside the MSYS2 MinGW64 shell so all libs are in PATH
      - name: Build roguelike.exe
        shell: msys2 {0}
        run: |
          g++ -std=c++17 \
            src/main.cpp src/Engine.cpp src/Actor.cpp src/Map.cpp \
            -o roguelike.exe \
            $(pkg-config --cflags --libs libtcod sdl3 zlib) \
            -mwindows

      # Collect the exe + font data into a folder ready for distribution
      - name: Package release files
        shell: msys2 {0}
        run: |
          mkdir -p release
          cp roguelike.exe release/
          cp -r data/ release/data/
          # Copy all DLLs that roguelike.exe depends on
          for dll in $(ldd roguelike.exe | grep mingw | awk '{print $3}'); do
            cp "$dll" release/ 2>/dev/null || true
          done

      # Upload to GitHub Releases automatically when the tag is pushed
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**
          name: "Release ${{ github.ref_name }}"
          body: "Windows x64 build of ${{ github.ref_name }}"
