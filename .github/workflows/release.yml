name: Build Release

# Runs when you push a version tag like: git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-zlib
            git

      # libtcod is not reliably available as an MSYS2 package, so build from source
      - name: Cache libtcod (Windows)
        id: cache-libtcod-windows
        uses: actions/cache@v4
        with:
          path: C:\msys64\opt\prebuilt
          key: windows-libtcod-2.2.2
          restore-keys: |
            windows-libtcod-

      - name: Build and install libtcod
        if: steps.cache-libtcod-windows.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 2.2.2 https://github.com/libtcod/libtcod.git /tmp/libtcod
          cmake -S /tmp/libtcod -B /tmp/libtcod/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBTCOD_SDL3=find \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/prebuilt
          cmake --build /tmp/libtcod/build --parallel
          cmake --install /tmp/libtcod/build

      - name: Build roguelike.exe
        shell: msys2 {0}
        run: |
          g++ -std=c++17 \
            src/main.cpp src/Engine.cpp src/Actor.cpp src/Map.cpp \
            -o roguelike.exe \
            -I/opt/prebuilt/include -I/mingw64/include \
            -L/opt/prebuilt/lib -L/mingw64/lib \
            -ltcod -lSDL3 -lz \
            -mwindows

      - name: Package Windows release
        shell: msys2 {0}
        run: |
          mkdir -p release-windows
          cp roguelike.exe release-windows/
          cp -r data/ release-windows/data/
          # Copy all MinGW DLLs the exe depends on
          for dll in $(ldd roguelike.exe | grep mingw | awk '{print $3}'); do
            cp "$dll" release-windows/ 2>/dev/null || true
          done
          # Zip it up for a clean single download
          7z a roguelike-windows-x64.zip ./release-windows/*

      - name: Upload Windows build to Release
        uses: softprops/action-gh-release@v2
        with:
          files: roguelike-windows-x64.zip
          name: "Release ${{ github.ref_name }}"
          body: "Automated builds for ${{ github.ref_name }}"

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # libtcod isn't in Ubuntu's default apt repos, so we build from the
      # vcpkg package manager which has it. Alternatively, install from source.
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl gnupg \
            g++ cmake pkg-config ninja-build \
            zlib1g-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev

      - name: Create prebuilt install directories
        run: |
          sudo mkdir -p /opt/prebuilt/sdl3 /opt/prebuilt/libtcod
          sudo chown -R "$USER" /opt/prebuilt

      # Build SDL3 from source — avoids relying on packages.libsdl.org being reachable
      - name: Cache SDL3 (Linux)
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /opt/prebuilt/sdl3
          key: linux-sdl3-release-3.2.10
          restore-keys: |
            linux-sdl3-

      - name: Build and install SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch release-3.2.10 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/prebuilt/sdl3
          cmake --build /tmp/SDL/build --parallel
          cmake --install /tmp/SDL/build
          sudo ldconfig

      # Build libtcod from source (no apt package available)
      - name: Cache libtcod (Linux)
        id: cache-libtcod
        uses: actions/cache@v4
        with:
          path: /opt/prebuilt/libtcod
          key: linux-libtcod-2.2.2
          restore-keys: |
            linux-libtcod-

      - name: Build and install libtcod
        if: steps.cache-libtcod.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 2.2.2 https://github.com/libtcod/libtcod.git /tmp/libtcod
          cmake -S /tmp/libtcod -B /tmp/libtcod/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBTCOD_SDL3=find \
            -DSDL3_DIR=/opt/prebuilt/sdl3/lib/cmake/SDL3 \
            -DCMAKE_INSTALL_PREFIX=/opt/prebuilt/libtcod
          cmake --build /tmp/libtcod/build --parallel
          cmake --install /tmp/libtcod/build
          sudo ldconfig

      - name: Build roguelike (Linux)
        run: |
          g++ -std=c++17 \
            src/main.cpp src/Engine.cpp src/Actor.cpp src/Map.cpp \
            -o roguelike \
            -I/opt/prebuilt/sdl3/include -I/opt/prebuilt/libtcod/include \
            -L/opt/prebuilt/sdl3/lib -L/opt/prebuilt/libtcod/lib \
            -ltcod -lSDL3 -lutf8proc -llodepng-c -lz

      - name: Package Linux release
        run: |
          mkdir -p release-linux
          cp roguelike release-linux/
          cp -r data/ release-linux/data/
          tar -czf roguelike-linux-x64.tar.gz -C release-linux .

      - name: Upload Linux build to Release
        uses: softprops/action-gh-release@v2
        with:
          files: roguelike-linux-x64.tar.gz
          name: "Release ${{ github.ref_name }}"
          body: "Automated builds for ${{ github.ref_name }}"

